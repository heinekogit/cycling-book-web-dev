name: Deploy Cycling Book development site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: development-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Insert restricted public Mapbox token into static build
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get('VITE_MAPBOX_TOKEN', '')
          if not token.startswith('pk.'):
              raise SystemExit('Missing public Mapbox token in VITE_MAPBOX_TOKEN secret')
          placeholder = 'CB_DEV_MAPBOX_TOKEN_PLACEHOLDER'
          found = 0
          for path in Path('assets').glob('*.js'):
              content = path.read_text()
              occurrences = content.count(placeholder)
              if occurrences:
                  path.write_text(content.replace(placeholder, token))
                  found += occurrences
          if found != 2:
              raise SystemExit(f'Expected two Mapbox token placeholders, found {found}')
          PY
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html 404.html _site/
          cp -R assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
